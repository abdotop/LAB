name: CI/CD E-Parrainages

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18.x'
  FLUTTER_VERSION: '3.16.x'

jobs:
  # Tests Backend
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: e_parrainages_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install Backend Dependencies
      working-directory: ./backend
      run: npm ci

    - name: Generate Prisma Client
      working-directory: ./backend
      run: npx prisma generate

    - name: Run Database Migrations
      working-directory: ./backend
      run: npx prisma migrate deploy
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/e_parrainages_test

    - name: Run Backend Tests
      working-directory: ./backend
      run: npm test
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/e_parrainages_test
        JWT_SECRET: test-secret

    - name: Lint Backend Code
      working-directory: ./backend
      run: npm run lint

  # Tests DGE Admin
  dge-admin-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: apps/dge-admin/package-lock.json

    - name: Install DGE Admin Dependencies
      working-directory: ./apps/dge-admin
      run: npm ci

    - name: Build DGE Admin
      working-directory: ./apps/dge-admin
      run: npm run build

    - name: Lint DGE Admin Code
      working-directory: ./apps/dge-admin
      run: npm run lint

  # Tests Mandataires Web
  mandataires-web-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: apps/mandataires-web/package-lock.json

    - name: Install Mandataires Web Dependencies
      working-directory: ./apps/mandataires-web
      run: npm ci

    - name: Build Mandataires Web
      working-directory: ./apps/mandataires-web
      run: npm run build

    - name: Lint Mandataires Web Code
      working-directory: ./apps/mandataires-web
      run: npm run lint

  # Tests Mobile App
  mobile-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}

    - name: Get Flutter Dependencies
      working-directory: ./apps/mobile
      run: flutter pub get

    - name: Analyze Flutter Code
      working-directory: ./apps/mobile
      run: flutter analyze

    - name: Run Flutter Tests
      working-directory: ./apps/mobile
      run: flutter test

  # Déploiement (uniquement sur main)
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [backend-tests, dge-admin-tests, mandataires-web-tests, mobile-tests]
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Backend Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: eparrainages/backend:latest

    - name: Build and Push DGE Admin Image
      uses: docker/build-push-action@v5
      with:
        context: ./apps/dge-admin
        push: true
        tags: eparrainages/dge-admin:latest

    - name: Build and Push Mandataires Web Image
      uses: docker/build-push-action@v5
      with:
        context: ./apps/mandataires-web
        push: true
        tags: eparrainages/mandataires-web:latest

    - name: Deploy to Production
      run: |
        echo "Déploiement en production..."
        # Ici, ajouter les commandes de déploiement
        # Par exemple: kubectl apply -f k8s/ ou docker-compose up -d