version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess
      POSTGRES_DB: chess
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://chess:chess@db:5432/chess?sslmode=disable
      JWT_SECRET: your-secret-key-change-in-production
      REDIS_URL: redis://redis:6379
      SERVER_PORT: 8080
    depends_on:
      - db
      - redis
    restart: unless-stopped

volumes:
  postgres_data: